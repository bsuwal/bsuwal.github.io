  - date: 2025-11-21
    post: <p> <a href="https://aeon.co/essays/generative-ai-has-access-to-a-small-slice-of-human-knowledge">This is a brilliant article</a>
           on the disparities that AI is creating, and eloquently expresses ideas I have wanted to express myself for a while.
           Certain types of knowledge (like ecology) are very locale-specific. If it happens that the way this
           knowledge has been historically transferred is through oral history and direct apprenticeship, then these
           crucial forms of knowledge are disadvantaged in transmission through print, and even more so on "second-order"
           print-driven tools like LLMs. The politics of what information is offered to whom is a topic that needs much, much more serious acknowledgement.</p>
    tag: ai

