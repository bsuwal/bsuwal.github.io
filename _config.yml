lang: en # the language of your site (for example: en, fr, cn, ru, etc.)
icon: 🎲  # the emoji used as the favicon (alternatively, provide image name in /assets/img/)

url: "https://asanchowk.com" # the base hostname & protocol for your site
title: "asan chowk"

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

navbar_fixed: true

# Dimensions
max_width: 800px

permalink: /blog/:year/:title/

# Markdown and syntax highlight
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

collections:
  notebooks:
    output: true

# Includes & excludes
include: ['_pages']
exclude:
  - bin
  - Gemfile
  - Gemfile.lock
  - vendor
  - microblog

# Site data (microblog/*.yml) lives outside the conventional _data folder;
# excluded above so Jekyll doesn't also copy the raw yml into the built site.
data_dir: microblog
keep_files:
  - CNAME
  - .nojekyll
  - .git

# Plug-ins
plugins:
  - jekyll-archives
  - jekyll-feed
  - jekyll-imagemagick
  - jekyll-sitemap
  - jekyll-target-blank
  - jekyll-scholar

# Sitemap settings
defaults:
  - scope:
      path:            "assets/**/*.*"
    values:
      sitemap:         false

# -----------------------------------------------------------------------------
# Jekyll optimization
# -----------------------------------------------------------------------------

# CSS/SASS minify
sass:
  style: compressed

# -----------------------------------------------------------------------------
# Jekyll Archives
# -----------------------------------------------------------------------------

jekyll-archives:
  enabled: [tags] # enables year and tag archives (remove if you need to disable one of them).
  layouts:
    tag: archive-tag
  permalinks:
    tag: '/blog/tag/:name/'

# -----------------------------------------------------------------------------
# Responsive WebP Images
# -----------------------------------------------------------------------------

imagemagick:
  enabled: true
  widths:
    - 480
    - 800
    - 1400
  input_directories:
    - assets/img/
  input_formats:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".tiff"
  output_formats:
    webp: "-quality 100%"


enable_math:                true   # enables math typesetting (uses MathJax)

# -----------------------------------------------------------------------------
# Library versions
# -----------------------------------------------------------------------------

bootstrap:
  version: "4.6.1"
  integrity:
    css: "sha256-DF7Zhf293AJxJNTmh5zhoYYIMs2oXitRfBjY+9L//AY="
mathjax:
  version: "3.2.0"
