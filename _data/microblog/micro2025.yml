  - date: 2025-05-14
    post: In the programming sense, parameters passed to functions are called "arguments".
          <a href="https://softwareengineering.stackexchange.com/questions/186293/why-are-actual-parameters-called-arguments">
          This stackoverflow thread</a> says that arguments mean "something from which another thing may be deduced"
          (so, more in line with the colloquial use of the word "argument").
    tag: etymology software

  - date: 2025-05-14
    post: Why does $\{ \vec{0} \}$ have dimension 0?
          As <a href="https://math.stackexchange.com/questions/664594/why-mathbf0-has-dimension-zero">this thread</a>
          clarified, vectors themselves do not have dimension, subspaces do.
    tag: linear_algebra

  - date: 2025-06-03
    post: <a href="https://www.bbc.co.uk/future/article/20241008-the-troubling-future-of-ai-relationships">This article on
          AI girlfriends </a> is incredibly disturbing. Unfortunately very smart people I know have also used AI as therapists and swear by it.

          <br> <br>
          On social (?) validation - <br>
            "The constant flow of affirmation and positivity gives people the dopamine hit they crave. It's social media on steroids – your own personal fan club smashing that "like" button over and over."

          <br> <br>
          On the effects on especially vulnerable populations - <br>
            "As one man struggling with alcoholism and depression recounted to The Guardian newspaper, he underestimated "how much receiving all these words of care and support would affect me"."

          <br> <br>
          On the inevitable late-stage capitalism intersection where this is headed towards - <br>
            "One truly dystopian element could be if these bots become integrated into Big Tech's advertising model - "Honey, you look thirsty, you should pick up a refreshing *insert name of advertiser here*?" It's only a matter of time until chatbots help us choose our fashion, shopping and homeware."

          <br> <br>
          And finally - <br>
            "Just as with the first generation of social media, we are woefully unprepared for the full psychological effects of this tool..."
